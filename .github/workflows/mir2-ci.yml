name: mir2 CI

# PR gate for the mir2-web3 rewrite. The repo's other workflows are manual
# (workflow_dispatch) or push-to-main only, so PRs currently merge with no check.
# This adds a durable green gate on every PR into main:
#   - web-resource-gate: typecheck + the offline resource/audio verification suite
#   - rust-workspace:    workspace build + the deterministic gameplay-logic tests
# Jobs are path-gated so web-only PRs don't pay for a cold Rust build and vice versa.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, claude/sweet-johnson-v9lEB]
  workflow_dispatch:

concurrency:
  group: mir2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists changed files via the PR API on pull_request events;
  # without this it 403s and the `changes` job fails, which previously caused the
  # real gates to be skipped (false green). Keep this so change-detection works.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
      onchain: ${{ steps.filter.outputs.onchain }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'mir2-web3/apps/web/**'
              - '.github/workflows/mir2-ci.yml'
            rust:
              - 'mir2-web3/apps/admin-api/**'
              - 'mir2-web3/apps/gateway/**'
              - 'mir2-web3/apps/simulation/**'
              - 'mir2-web3/packages/**'
              - 'mir2-web3/Cargo.toml'
              - 'mir2-web3/Cargo.lock'
            onchain:
              - 'mir2-web3/onchain/**'
              - '.github/workflows/mir2-ci.yml'

  web-resource-gate:
    needs: changes
    # Fail-safe: run when web paths changed OR when change-detection did not
    # succeed, so a broken `changes` job can never silently skip the real gate.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mir2-web3/apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mir2-web3/apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Verify committed assets, the locally installed sound subset, and the
      # temp-fixture sound exporter. Clean runners do not contain the ignored
      # full Crystal sound library; strict local closure is enabled separately
      # when producing an authorized audio release.
      - name: Offline resource/audio gate
        run: npm run assets:verify:offline
      - name: Verify committed generated artifacts are in sync
        # The present-sound manifest is a committed, deterministic build input; the gate
        # regenerates it, so any drift here means it was not regenerated before commit.
        run: git diff --exit-code -- lib/generated/crystal-present-sounds.generated.json

  rust-workspace:
    needs: changes
    # Fail-safe: run when rust paths changed OR when change-detection did not
    # succeed, so a broken `changes` job can never silently skip the real gate.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    defaults:
      run:
        working-directory: mir2-web3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mir2-web3/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mir2-web3/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Prepare Linux desktop sidecars
        run: node apps/dubhe-node-desktop/scripts/prepare-sidecars.mjs
        env:
          DUBHE_NODE_TARGET: x86_64-unknown-linux-gnu
      - name: Build workspace
        run: cargo build --workspace --locked
      # Deterministic gameplay-logic crates. mir2-simulation's integration tests
      # (hero_ai, ranking, security_lifecycle, shared_zone, social_economy_integration,
      # vertical_slice) plus protocol/game-data unit tests; none require Postgres/Redis/network.
      # admin-api/gateway tests that need external services are intentionally excluded.
      - name: Test core crates
        run: cargo test -p mir2-simulation -p mir2-protocol -p mir2-game-data --locked -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: always

  # On-chain smart mine (mir2-web3/onchain): a standalone Dubhe/Sui workspace,
  # isolated from the Rust workspace and the web app. Path-gated so it only runs
  # for onchain PRs. Gate = TS typecheck (Dubhe SDK) + Move build/test.
  onchain:
    needs: changes
    # Fail-safe: run when onchain paths changed OR when change-detection did not
    # succeed, so a broken `changes` job can never silently skip this gate.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.onchain == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mir2-web3/onchain
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mir2-web3/onchain/pnpm-lock.yaml
      - name: Install TS deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck (Dubhe config + scripts + relayer)
        run: pnpm typecheck
      - name: Relayer unit tests (normalize + dedup)
        run: pnpm test:relayer
      - name: Install Sui CLI (pinned testnet binary)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SUI_TAG=testnet-v1.73.0
          curl -fsSL -o /tmp/sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_TAG}/sui-${SUI_TAG}-ubuntu-x86_64.tgz"
          mkdir -p /tmp/sui-bin
          tar -xzf /tmp/sui.tgz -C /tmp/sui-bin
          SUI_BIN="$(find /tmp/sui-bin -maxdepth 2 -type f -name sui | head -1)"
          sudo install -m 0755 "$SUI_BIN" /usr/local/bin/sui
          sui --version
      - name: Configure Sui client (testnet, non-interactive)
        working-directory: ${{ github.workspace }}
        # First run creates ~/.sui config and defaults the active env to testnet.
        # `move build`/`test` resolve framework addresses from the active env.
        run: printf 'y\n' | sui client envs >/dev/null 2>&1 || true
      - name: Move build + test
        run: |
          sui client switch --env testnet || true
          pnpm move:test
