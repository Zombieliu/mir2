name: Publish frozen Android v40 APK to R2
on:
  push:
    branches: [codex/android-apk-r2-20261109]
    paths:
      - .github/workflows/android-apk-r2-upload.yml
      - .github/scripts/android-apk-r2-v40/**
  workflow_dispatch:
permissions:
  # GitHub requires push access to retrieve this unpublished staging draft.
  contents: write
concurrency:
  group: mir2-android-v40-r2-upload
  cancel-in-progress: false
jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed scripts and existing asset uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/android-apk-r2-v40
            mir2-web3/apps/web/scripts
      - name: Download the exact draft APK and verify its SHA256 before credentials are available
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/android-apk-r2-v40/prepare.mjs
      - name: Dry run exactly one immutable APK through the existing uploader
        run: |
          node mir2-web3/apps/web/scripts/upload-r2-assets.mjs --manifest "$RUNNER_TEMP/mir2-apk-r2-release.json" --driver worker --bucket mir2-web3-assets --includeReleaseManifest false --ensureBucket false --dryRun true
      - name: Upload the APK through the existing authenticated service
        env:
          MIR2_R2_UPLOAD_WORKER_URL: ${{ secrets.MIR2_R2_UPLOAD_WORKER_URL }}
          MIR2_R2_UPLOAD_SECRET: ${{ secrets.MIR2_R2_UPLOAD_SECRET }}
        run: |
          node mir2-web3/apps/web/scripts/upload-r2-assets.mjs --manifest "$RUNNER_TEMP/mir2-apk-r2-release.json" --driver worker --bucket mir2-web3-assets --includeReleaseManifest false --ensureBucket false --concurrency 1 --maxAttempts 3 --progressEvery 1
      - name: Verify actual public APK bytes, type and Range fallback policy
        run: node .github/scripts/android-apk-r2-v40/verify.mjs
