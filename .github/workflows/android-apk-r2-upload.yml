name: Publish frozen Android v40 APK to R2
on:
  push:
    branches: [codex/android-apk-r2-20261109]
    paths:
      - .github/workflows/android-apk-r2-upload.yml
      - .github/scripts/android-apk-r2-v40/**
  workflow_dispatch:

permissions:
  # GitHub requires push access to retrieve an unpublished draft release.
  # The script only downloads this pinned staging asset and never publishes it.
  contents: write

concurrency:
  group: mir2-android-v40-r2-upload
  cancel-in-progress: false

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the reviewed publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/android-apk-r2-v40
      - name: Verify fixed object, origin, checksum and overwrite guards without credentials
        run: node --test .github/scripts/android-apk-r2-v40/worker.test.mjs
      - name: Verify existing upload credentials without writing any object
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIR2_R2_ASSET_BUCKET: ${{ secrets.MIR2_R2_ASSET_BUCKET }}
          MIR2_R2_BUCKET: ${{ secrets.MIR2_R2_BUCKET }}
          MIR2_R2_UPLOAD_WORKER_URL: ${{ secrets.MIR2_R2_UPLOAD_WORKER_URL }}
          MIR2_R2_UPLOAD_SECRET: ${{ secrets.MIR2_R2_UPLOAD_SECRET }}
        run: python3 .github/scripts/android-apk-r2-v40/probe-upload.py
      - name: Ensure this run's temporary transfer Worker is removed
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/android-apk-r2-v40/publish.py --cleanup
