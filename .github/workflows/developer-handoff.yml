name: Developer Handoff Smoke

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "README.md"
      - "CONTRIBUTING.md"
      - "mir2-web3/apps/web/**"
      - "mir2-web3/apps/admin-web/**"
      - "mir2-web3/apps/gateway/**"
      - "mir2-web3/apps/admin-api/**"
      - "mir2-web3/apps/simulation/**"
      - "mir2-web3/config/developer-assets.json"
      - "mir2-web3/infra/cloudflare/mir2-domain-proxy/**"
      - "mir2-web3/packages/**"
      - "mir2-web3/scripts/*developer*.ps1"
      - "mir2-web3/docs/*DEVELOPER*"
      - "mir2-web3/docs/*ASSET*"
      - ".github/workflows/developer-handoff.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-checkout-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout with Crystal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify pinned Crystal commit
        shell: pwsh
        run: |
          $expected = (git ls-tree HEAD Crystal).Split()[2]
          $actual = (git -C Crystal rev-parse HEAD).Trim()
          if ($expected -ne $actual) {
            throw "Crystal mismatch: expected $expected, found $actual"
          }
          $remote = git -C Crystal ls-remote origin refs/heads/codex/handoff-parity-tools | Out-String
          if ($LASTEXITCODE -ne 0 -or $remote -notmatch [regex]::Escape($expected)) {
            throw "Crystal commit $expected is not reachable from the configured handoff branch"
          }

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mir2-web3/apps/web/package-lock.json
            mir2-web3/apps/admin-web/package-lock.json

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Install Web dependencies
        run: |
          npm ci --prefix mir2-web3/apps/web
          npm ci --prefix mir2-web3/apps/admin-web

      - name: Audit Web dependencies
        run: |
          npm audit --audit-level=high --prefix mir2-web3/apps/web
          npm audit --audit-level=high --prefix mir2-web3/apps/admin-web

      - name: Check Gateway and Admin API
        working-directory: mir2-web3
        run: cargo +1.89.0 check --locked -p mir2-gateway -p mir2-admin-api

      - name: Test asset release safety
        working-directory: mir2-web3/apps/web
        run: npm run test:asset-release-safety && npm run test:domain-proxy-routing

      - name: Test developer asset installer
        shell: pwsh
        working-directory: mir2-web3
        run: ./scripts/test-developer-asset-installer.ps1

      - name: Fetch pinned prebuilt Bevy runtime
        id: bevy_prebuilt
        continue-on-error: true
        working-directory: mir2-web3/apps/web
        run: npm run runtime:fetch:prebuilt

      - name: Install pinned Bevy runtime build tools
        if: ${{ steps.bevy_prebuilt.outcome == 'failure' }}
        shell: pwsh
        working-directory: mir2-web3/apps/game-client/runtime
        run: |
          $toolchainText = Get-Content -LiteralPath rust-toolchain.toml -Raw
          $toolchainMatch = [regex]::Match($toolchainText, '(?m)^channel\s*=\s*"([^"]+)"')
          if (-not $toolchainMatch.Success) {
            throw "Unable to resolve the pinned runtime toolchain from rust-toolchain.toml"
          }
          $toolchain = $toolchainMatch.Groups[1].Value

          $lockText = Get-Content -LiteralPath Cargo.lock -Raw
          $wasmBindgenMatch = [regex]::Match(
            $lockText,
            '(?ms)^\[\[package\]\]\s*\r?\nname = "wasm-bindgen"\s*\r?\nversion = "([^"]+)"'
          )
          if (-not $wasmBindgenMatch.Success) {
            throw "Unable to resolve the pinned wasm-bindgen version from Cargo.lock"
          }
          $wasmBindgenVersion = $wasmBindgenMatch.Groups[1].Value

          rustup toolchain install `
            $toolchain `
            --profile minimal `
            --component rustfmt `
            --target wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install runtime toolchain $toolchain"
          }
          $runtimeCargo = (rustup which cargo --toolchain $toolchain).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $runtimeCargo)) {
            throw "Unable to resolve cargo for runtime toolchain $toolchain"
          }
          $runtimeRustc = (rustup which rustc --toolchain $toolchain).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $runtimeRustc)) {
            throw "Unable to resolve rustc for runtime toolchain $toolchain"
          }
          & $runtimeCargo install wasm-bindgen-cli --version $wasmBindgenVersion --locked
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install wasm-bindgen-cli $wasmBindgenVersion"
          }
          "CARGO_BIN=$runtimeCargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTC=$runtimeRustc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild pinned Bevy runtime from source
        if: ${{ steps.bevy_prebuilt.outcome == 'failure' }}
        working-directory: mir2-web3/apps/web
        env:
          MIR2_USE_PREBUILT_BEVY_RUNTIME: "0"
        run: npm run runtime:build:release

      - name: Build Player Web with tracked runtime
        working-directory: mir2-web3/apps/web
        env:
          MIR2_USE_PREBUILT_BEVY_RUNTIME: "1"
        run: npm run build

      - name: Verify tracked Bevy runtime manifest remains exact
        shell: pwsh
        run: git diff --exit-code -- mir2-web3/apps/web/lib/generated/bevy_runtime_version.json

      - name: Typecheck and build Admin Web
        working-directory: mir2-web3/apps/admin-web
        run: npm run typecheck && npm run build

      - name: Probe published full asset pack
        if: ${{ vars.MIR2_FULL_ASSET_BASE_URL != '' }}
        shell: pwsh
        run: |
          $baseUrl = "${{ vars.MIR2_FULL_ASSET_BASE_URL }}".TrimEnd('/')
          $manifestPath = Join-Path $env:RUNNER_TEMP "mir2-remote-asset-release.json"
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "$baseUrl/remote-asset-release.json" `
            -OutFile $manifestPath `
            -TimeoutSec 30
          Push-Location mir2-web3/apps/web
          try {
            node ./scripts/release-doctor.mjs `
              --manifest $manifestPath `
              --checkManifest true `
              --checkR2 true `
              --checkWorker false `
              --checkBevyRuntime false `
              --requireFullCrystalPack true `
              --probeConcurrency 32 `
              --assetBaseUrl $baseUrl
            if ($LASTEXITCODE -ne 0) {
              throw "Published full asset pack verification failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }
