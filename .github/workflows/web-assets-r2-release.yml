name: Promotion Website Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the original website project without changing deployments
        required: true
        default: context
        type: choice
        options: [context]

permissions:
  contents: read

concurrency:
  group: promotion-website-release
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify existing deployment credentials and project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const team = 'team_pXY7oaLtibSTlKSmKXMXzrQR';
          const project = 'prj_Bl3ttB4PzcdCpJMYLRhzQjkdXyTz';
          if (!process.env.VERCEL_TOKEN) throw Error('Missing existing Vercel CI credential');
          if (process.env.VERCEL_ORG_ID !== team || process.env.VERCEL_PROJECT_ID !== project) {
            throw Error('Existing CI credentials do not identify the original website project');
          }
          const response = await fetch(`https://api.vercel.com/v9/projects/${project}?teamId=${team}`, {
            headers: {Authorization: `Bearer ${process.env.VERCEL_TOKEN}`}
          });
          if (!response.ok) throw Error(`Project inspection failed: HTTP ${response.status}`);
          const value = await response.json();
          if (value.id !== project || value.accountId !== team || value.name !== 'mir2-web3-web') {
            throw Error('Project identity mismatch');
          }
          console.log(JSON.stringify({
            id: value.id, name: value.name, accountId: value.accountId,
            rootDirectory: value.rootDirectory, buildCommand: value.buildCommand,
            installCommand: value.installCommand, framework: value.framework,
            nodeVersion: value.nodeVersion, outputDirectory: value.outputDirectory,
            sourceFilesOutsideRootDirectory: value.sourceFilesOutsideRootDirectory,
            commandForIgnoringBuildStep: value.commandForIgnoringBuildStep,
            git: value.link ? {type:value.link.type, repo:value.link.repo, productionBranch:value.link.productionBranch}:null,
            environmentKeys: (value.env || []).map(entry => entry.key).sort()
          }, null, 2));
          NODE
