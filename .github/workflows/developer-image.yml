name: Publish Developer Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/developer-image.yml"
      - "mir2-web3/infra/.dockerignore"
      - "mir2-web3/infra/developer-asset-fetch.sh"
      - "mir2-web3/infra/developer.Dockerfile"
      - "mir2-web3/infra/developer-entrypoint.sh"
  workflow_dispatch:

concurrency:
  group: developer-image-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: Publish amd64/arm64 toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: mir2-web3/infra
          file: mir2-web3/infra/developer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zombieliu/mir2-developer:main
            ghcr.io/zombieliu/mir2-developer:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record immutable digest
        run: |
          {
            echo "### Developer image published"
            echo
            echo "\`ghcr.io/zombieliu/mir2-developer@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Update \`config/developer-release.json\` only after the clean-room workflow passes."
          } >> "$GITHUB_STEP_SUMMARY"
