name: Mir2 Candidate Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-candidate-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mir2-web3/apps/admin-web/package-lock.json
            mir2-web3/apps/web/package-lock.json

      - name: Install Admin Web dependencies
        run: npm ci --prefix mir2-web3/apps/admin-web

      - name: Install Player Web dependencies
        run: npm ci --prefix mir2-web3/apps/web

      - name: Run local Candidate gate
        run: cd mir2-web3 && MIR2_CANDIDATE_SCOPE=local bash infra/check-candidate-gate.sh

      - name: Inventory Candidate evidence
        if: ${{ always() }}
        run: node mir2-web3/scripts/summarize-qa-evidence.mjs

      - name: Upload Candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mir2-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mir2-web3/artifacts/qa-evidence/summary.json
            mir2-web3/docs/generated/player-qa/
            mir2-web3/docs/generated/packet-traces/
            mir2-web3/docs/stage2-screenshots/
            mir2-web3/docs/stage5-screenshots/
