name: Publish pinned Android v41 map-entry APK to R2
on:
  push:
    branches: [codex/android-map-entry-v41-20261109]
    paths:
      - .github/workflows/android-apk-r2-v41-upload.yml
      - .github/scripts/android-apk-r2-v41/**
  workflow_dispatch:
permissions:
  # Unpublished draft assets require repository push permission for retrieval.
  contents: write
concurrency:
  group: mir2-android-v41-r2-upload
  cancel-in-progress: false
jobs:
  publish-pinned-apk:
    if: ${{ github.ref == 'refs/heads/codex/android-map-entry-v41-20261109' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed pins, verification scripts and existing uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/android-apk-r2-v41
            mir2-web3/apps/web/scripts
      - name: Test chunk, size, gzip and credential-origin failure cases without credentials
        run: node --test .github/scripts/android-apk-r2-v41/chunks.test.mjs
      - name: Verify pinned draft chunks, gzip bytes and exact signed APK before upload credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/android-apk-r2-v41/prepare.mjs
      - name: Dry run exactly one immutable APK through the existing uploader
        run: |
          node mir2-web3/apps/web/scripts/upload-r2-assets.mjs --manifest "$RUNNER_TEMP/mir2-apk-v41/release.json" --driver worker --bucket mir2-web3-assets --includeReleaseManifest false --ensureBucket false --dryRun true
      - name: Upload only the verified APK through the existing authenticated service
        env:
          MIR2_R2_UPLOAD_WORKER_URL: ${{ secrets.MIR2_R2_UPLOAD_WORKER_URL }}
          MIR2_R2_UPLOAD_SECRET: ${{ secrets.MIR2_R2_UPLOAD_SECRET }}
        run: |
          node mir2-web3/apps/web/scripts/upload-r2-assets.mjs --manifest "$RUNNER_TEMP/mir2-apk-v41/release.json" --driver worker --bucket mir2-web3-assets --includeReleaseManifest false --ensureBucket false --concurrency 1 --maxAttempts 3 --progressEvery 1
      - name: Verify public APK type, complete logical bytes and existing Range fallback
        run: node .github/scripts/android-apk-r2-v41/verify.mjs
