name: Mir2 Gateway Release Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag, for example 2026-05-18-001
        required: false
        type: string
      publish_r2:
        description: Upload the package to Cloudflare R2
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  siege-acceptance:
    uses: ./.github/workflows/sabuk-acceptance.yml

  build-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Verify shared player appearance and equipment ingress
        working-directory: mir2-web3
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p mir2-simulation --test shared_player_appearance -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --lib shared_player_appearance_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --lib world_checkpoint_removes_sessions_players_and_pending_packets -- --test-threads=1

      - name: Verify disconnect cancellation and trusted journal recovery
        working-directory: mir2-web3
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p mir2-simulation --lib runtime::recovery:: -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --lib -- --test-threads=1 web:: abnormal_teardown_ rpc_zone_owner_command_client save_recovery::tests

      - name: Verify Linux release and save-recovery boundary
        working-directory: mir2-web3
        env:
          MIR2_REQUIRE_LINUX_SECURITY_GATE: "1"
        run: bash scripts/selftest-gateway-save-recovery.sh

      - name: Verify rejected combat targets acknowledge and retire old movement
        working-directory: mir2-web3
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p mir2-simulation --lib movement_deadline_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --lib -- --test-threads=1 unavailable_combat_target owner_location_order owner_attack_animation movement_deadline crowded_escape_tests

      - name: Verify SnakeTotem immediate master and corpse permissions
        working-directory: mir2-web3
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p mir2-simulation --test shared_snake_master_lifecycle -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --lib owned_pet_immediate_master_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --lib owned_pet_combat::tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --lib experience_ownership -- --test-threads=1

      - name: Verify classic shared gameplay and durable source receipts
        working-directory: mir2-web3
        run: |
          set -euo pipefail
          cargo +1.89.0 test --locked -p mir2-simulation --features test-support --lib mentor_reward_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --features test-support --lib default_npc_events_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --features test-support --lib refine_durable_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --features test-support --lib shared_player_kill_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-simulation --features test-support --test shared_pet_pvp --test shared_original_party_experience --test shared_guild_normal_kill --test shared_crowded_escape --test market_refine_custody --test refine_oven_custody -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --features mir2-simulation/test-support --test shared_guild_management --test shared_guild_rank_management --test shared_guild_rank_terminal --test shared_guild_wars -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --features mir2-simulation/test-support --lib owner_packet_normalization_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --features mir2-simulation/test-support --lib live_owner_wire_ids_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --features mir2-simulation/test-support --lib shared_player_kill_source_tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mir2-gateway --features mir2-simulation/test-support --test shared_pet_source_transport --test shared_mentor_source_transport -- --test-threads=1
          node --test tools/generate-crystal-default-npc-scripts.test.mjs

      - name: Package Gateway
        working-directory: mir2-web3
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # This dedicated ephemeral runner is the package publisher. The
          # packager verifies the effective non-root UID; it has no default.
          export MIR2_RELEASE_PUBLISHER_UID="$(id -u)"
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            export MIR2_RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            export MIR2_RELEASE_TAG="${GITHUB_SHA::12}"
          fi
          bash scripts/package-gateway-release.sh

      - name: Publish Gateway package to R2
        if: ${{ inputs.publish_r2 }}
        working-directory: mir2-web3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIR2_R2_RELEASE_BUCKET: ${{ secrets.MIR2_R2_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${MIR2_R2_RELEASE_BUCKET:-}" ]; then
            echo "R2 publish requested but one of CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or MIR2_R2_RELEASE_BUCKET is missing." >&2
            exit 1
          fi

          meta="dist/gateway-releases/latest-mir2-gateway-release.json"
          archive="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('$meta','utf8')); process.stdout.write(m.archive)")"
          tag="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('$meta','utf8')); process.stdout.write(m.tag)")"
          src="dist/gateway-releases/$archive"
          sum="$src.sha256"

          npx wrangler@4.112.0 r2 object put "$MIR2_R2_RELEASE_BUCKET/gateway/releases/$tag/mir2-gateway-linux-x64.tar.gz" --file "$src"
          npx wrangler@4.112.0 r2 object put "$MIR2_R2_RELEASE_BUCKET/gateway/releases/$tag/mir2-gateway-linux-x64.tar.gz.sha256" --file "$sum"
          npx wrangler@4.112.0 r2 object put "$MIR2_R2_RELEASE_BUCKET/gateway/releases/latest-mir2-gateway-release.json" --file "$meta"

      - name: Upload Gateway package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mir2-gateway-linux-x64
          path: |
            mir2-web3/dist/gateway-releases/*.tar.gz
            mir2-web3/dist/gateway-releases/*.sha256
            mir2-web3/dist/gateway-releases/latest-mir2-gateway-release.json
          if-no-files-found: error
