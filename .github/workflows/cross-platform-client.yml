name: Cross-platform client

on:
  pull_request:
    paths:
      - ".github/workflows/cross-platform-client.yml"
      - "mir2-web3/apps/game-client/**"
      - "mir2-web3/apps/mir2-launcher-tauri/**"
      - "mir2-web3/apps/mir2-mobile/**"
      - "mir2-web3/apps/web/public/bevy-entity-atlases/**"
      - "mir2-web3/apps/web/public/generated/map-atlas/**"
      - "mir2-web3/apps/web/public/original-map/**"
      - "mir2-web3/apps/web/scripts/build-native-keyed-map-pack.mjs"
      - "mir2-web3/apps/web/scripts/test-native-keyed-map-pack.mjs"
      - "mir2-web3/apps/web/package.json"
      - "mir2-web3/apps/web/package-lock.json"
      - "mir2-web3/apps/web/lib/generated/crystal_starter_map_region.json"
      - "mir2-web3/apps/web/lib/generated/crystal-map-pack/**"
      - "mir2-web3/apps/web/lib/scene-alpha-key.ts"
      - "mir2-web3/scripts/test-cross-platform-client-shells.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cross-platform-client.yml"
      - "mir2-web3/apps/game-client/**"
      - "mir2-web3/apps/mir2-launcher-tauri/**"
      - "mir2-web3/apps/mir2-mobile/**"
      - "mir2-web3/apps/web/public/bevy-entity-atlases/**"
      - "mir2-web3/apps/web/public/generated/map-atlas/**"
      - "mir2-web3/apps/web/public/original-map/**"
      - "mir2-web3/apps/web/scripts/build-native-keyed-map-pack.mjs"
      - "mir2-web3/apps/web/scripts/test-native-keyed-map-pack.mjs"
      - "mir2-web3/apps/web/package.json"
      - "mir2-web3/apps/web/package-lock.json"
      - "mir2-web3/apps/web/lib/generated/crystal_starter_map_region.json"
      - "mir2-web3/apps/web/lib/generated/crystal-map-pack/**"
      - "mir2-web3/apps/web/lib/scene-alpha-key.ts"
      - "mir2-web3/scripts/test-cross-platform-client-shells.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  NODE_VERSION: 22

jobs:
  shell-contracts:
    name: Shell security and packaging contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node mir2-web3/scripts/test-cross-platform-client-shells.mjs

  shared-rust:
    name: Shared Rust and WASM
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_TOOLCHAIN" wasm32-unknown-unknown
      - name: Formatting
        run: |
          cargo "+$RUST_TOOLCHAIN" fmt --manifest-path mir2-web3/apps/game-client/client-core/Cargo.toml -- --check
          cargo "+$RUST_TOOLCHAIN" fmt --manifest-path mir2-web3/apps/game-client/client-bevy/Cargo.toml -- --check
          cargo "+$RUST_TOOLCHAIN" fmt --manifest-path mir2-web3/apps/game-client/runtime/Cargo.toml -- --check
      - name: Unit tests
        run: |
          cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path mir2-web3/apps/game-client/client-core/Cargo.toml
          cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path mir2-web3/apps/game-client/client-bevy/Cargo.toml
          cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path mir2-web3/apps/game-client/runtime/Cargo.toml
      - name: WASM compile gate
        run: >-
          cargo "+$RUST_TOOLCHAIN" check --locked
          --manifest-path mir2-web3/apps/game-client/runtime/Cargo.toml
          --target wasm32-unknown-unknown

  windows-native:
    name: Windows native host and assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mir2-web3/apps/web/package-lock.json
      - name: Generate native map atlas
        shell: bash
        working-directory: mir2-web3/apps/web
        run: |
          npm ci
          npm run assets:map-atlas:build
          npm run assets:native-map-keyed:build
          npm run test:native-map-keyed
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
      - name: Test and build Windows host
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File mir2-web3/apps/game-client/platform-windows/scripts/build-attested-windows-candidate.ps1 -SelfTest
          cargo "+$env:RUST_TOOLCHAIN" fmt --manifest-path mir2-web3/apps/game-client/platform-windows/Cargo.toml -- --check
          cargo "+$env:RUST_TOOLCHAIN" test --locked --manifest-path mir2-web3/apps/game-client/platform-windows/Cargo.toml
          powershell -NoProfile -ExecutionPolicy Bypass -File mir2-web3/apps/game-client/platform-windows/scripts/build-attested-windows-candidate.ps1
          New-Item -ItemType Directory -Force mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64 | Out-Null
          Copy-Item mir2-web3/target-attested-windows-candidate/x86_64-pc-windows-msvc/release/mir2-platform-windows.exe mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/
          Copy-Item mir2-web3/target-attested-windows-candidate/BUILD-ATTESTATION.json mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/
      - name: Package native maps and atlases
        shell: bash
        run: >-
          mir2-web3/apps/game-client/platform-windows/package-assets.sh
          mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifactRoot = 'mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64'
          $exePath = Join-Path $artifactRoot 'mir2-platform-windows.exe'
          $attestationPath = Join-Path $artifactRoot 'BUILD-ATTESTATION.json'
          $attestation = Get-Content -LiteralPath $attestationPath -Raw | ConvertFrom-Json
          $head = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($attestation.schema -cne 'mir2.windows.build-attestation.v2') { throw 'unexpected Windows build attestation schema' }
          if ($attestation.gitRevision -cne $head) { throw 'Windows build attestation revision mismatch' }
          if ([bool]$attestation.worktreeDirty) { throw 'Windows build attestation unexpectedly records a dirty worktree' }
          if ($attestation.exeSha256 -cne $exeHash) { throw 'Windows artifact hash differs from build attestation' }
          if ($attestation.buildCommand.target -cne 'x86_64-pc-windows-msvc') { throw 'Windows build attestation target mismatch' }
          if ($attestation.buildCommand.targetDir -cne 'target-attested-windows-candidate') { throw 'Windows build attestation target directory mismatch' }
          if (-not [bool]$attestation.buildCommand.release -or -not [bool]$attestation.buildCommand.locked) { throw 'Windows build attestation release/locked contract mismatch' }
          Get-Item $exePath
          Get-Item $attestationPath
          Get-Item mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets/bevy-entity-atlases/manifest.json
          Get-Item mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets/generated/map-atlas/manifest.json
          Get-Item mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets/generated/native-map-keyed/manifest.json
          Get-Item mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets/crystal-map-pack/0.map.gz
          Get-Item mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64/mir2-assets/original-ui/Monster/000/0.png
      - uses: actions/upload-artifact@v7
        with:
          name: mir2-windows-x86_64
          path: mir2-web3/apps/game-client/platform-windows/dist/windows-x86_64
          retention-days: 7

  desktop-shells:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mir2-web3/apps/mir2-launcher-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mir2-web3/apps/mir2-launcher-tauri/package-lock.json
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - run: npm ci
      - name: Test launcher URL policy
        shell: bash
        run: >-
          cargo "+$RUST_TOOLCHAIN" test --locked
          --manifest-path src-tauri/Cargo.toml
      - name: Compile platform launcher
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: npx tauri build --no-bundle

  android:
    name: Android Capacitor and native Bevy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mir2-web3/apps/mir2-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mir2-web3/apps/mir2-mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Rust Android target
        working-directory: .
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android
      - name: Fetch native Bevy dependencies
        working-directory: .
        run: >-
          cargo "+$RUST_TOOLCHAIN" fetch --locked
          --manifest-path mir2-web3/apps/game-client/platform-android/Cargo.toml
      - name: Fetch Android target Bevy dependencies
        working-directory: .
        run: >-
          cargo "+$RUST_TOOLCHAIN" fetch --locked
          --manifest-path mir2-web3/apps/game-client/platform-android/Cargo.toml
          --target aarch64-linux-android
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build Capacitor APK
        run: cd android && ./gradlew assembleDebug
      - name: Compile native Bevy host
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          TARGET="aarch64-linux-android"
          API_LEVEL="${MIR2_ANDROID_API_LEVEL:-26}"
          [[ "$API_LEVEL" =~ ^[0-9]+$ ]] || { echo "Invalid Android API level: $API_LEVEL" >&2; exit 1; }

          NDK_HOME=""
          for candidate in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            [[ -d "$candidate" ]] && NDK_HOME="$candidate" && break
          done
          if [[ -z "$NDK_HOME" ]]; then
            for sdk_root in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
              [[ -n "$sdk_root" && -d "$sdk_root/ndk" ]] || continue
              NDK_HOME="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
              [[ -n "$NDK_HOME" ]] && break
            done
          fi
          [[ -d "$NDK_HOME" ]] || { echo "Android NDK not found from runner environment or SDK ndk directories" >&2; exit 1; }

          PREBUILT_ROOT="$NDK_HOME/toolchains/llvm/prebuilt"
          [[ -d "$PREBUILT_ROOT" ]] || { echo "NDK LLVM prebuilt directory not found below $NDK_HOME" >&2; exit 1; }
          LLVM_BIN="$(find "$PREBUILT_ROOT" -mindepth 1 -maxdepth 1 -type d -print | sort | tail -n 1)/bin"
          [[ -d "$LLVM_BIN" ]] || { echo "NDK LLVM prebuilt bin directory not found below $NDK_HOME" >&2; exit 1; }

          CC="$LLVM_BIN/${TARGET}${API_LEVEL}-clang"
          CXX="$LLVM_BIN/${TARGET}${API_LEVEL}-clang++"
          AR="$LLVM_BIN/llvm-ar"
          for tool in "$CC" "$CXX" "$AR"; do
            [[ -x "$tool" ]] || { echo "Required Android NDK tool is missing or not executable: $tool" >&2; exit 1; }
          done

          : "${GITHUB_PATH:?GITHUB_PATH is not set}"
          : "${GITHUB_ENV:?GITHUB_ENV is not set}"
          printf '%s\n' "$LLVM_BIN" >> "$GITHUB_PATH"
          export PATH="$LLVM_BIN:$PATH"
          export ANDROID_NDK_HOME="$NDK_HOME"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          export MIR2_ANDROID_TARGET="$TARGET"
          export MIR2_ANDROID_API_LEVEL="$API_LEVEL"
          export CC_aarch64_linux_android="$CC"
          export CXX_aarch64_linux_android="$CXX"
          export AR_aarch64_linux_android="$AR"
          export TARGET_CXX="$CXX"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR"
          for name in ANDROID_NDK_HOME ANDROID_NDK_ROOT MIR2_ANDROID_TARGET MIR2_ANDROID_API_LEVEL \
            CC_aarch64_linux_android CXX_aarch64_linux_android AR_aarch64_linux_android TARGET_CXX \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER CARGO_TARGET_AARCH64_LINUX_ANDROID_AR; do
            printf '%s=%s\n' "$name" "${!name}"
          done >> "$GITHUB_ENV"

          echo "Using Android NDK LLVM tools from $LLVM_BIN"
          mir2-web3/apps/game-client/platform-android/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mir2-android-debug-apk
          path: mir2-web3/apps/mir2-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator shell
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mir2-web3/apps/mir2-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mir2-web3/apps/mir2-mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: >-
          cd ios/App &&
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
