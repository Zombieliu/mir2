name: Publish pinned Bevy runtime leaves to R2

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Exact reviewed bevy-<16 lowercase hex> runtime version
        required: true
        type: string
      runtime_manifest_sha256:
        description: SHA256 of the reviewed lib/generated/bevy_runtime_version.json bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mir2-bevy-runtime-r2-release
  cancel-in-progress: false

jobs:
  publish-runtime-leaves:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mir2-web3/apps/web
    env:
      EXPECTED_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      EXPECTED_RUNTIME_MANIFEST_SHA256: ${{ inputs.runtime_manifest_sha256 }}
    steps:
      - name: Check out the exact reviewed dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mir2-web3/apps/web/package-lock.json

      - name: Install existing Web dependencies without publishing credentials
        run: npm ci

      - name: Test the bounded runtime upload checks
        run: node --test scripts/test-bevy-runtime-r2-upload.mjs

      - name: Verify the pinned manifest and three immutable packages
        run: node scripts/verify-bevy-runtime-r2-upload.mjs

      - name: Stage exactly six runtime leaves under the existing asset prefix
        run: |
          node scripts/build-bevy-runtime-r2-release.mjs \
            --assetVersion 20260818-main-97887dcd \
            --objectPrefix mir2/v/20260818-main-97887dcd \
            --assetBaseUrl https://assets.mir2.obelisk.build/mir2/v/20260818-main-97887dcd \
            --output "$RUNNER_TEMP/bevy-runtime-r2-release.json"
          node scripts/verify-bevy-runtime-r2-upload.mjs \
            --releaseManifest "$RUNNER_TEMP/bevy-runtime-r2-release.json"

      - name: Dry run the existing uploader before credentials are available
        run: |
          node scripts/upload-r2-assets.mjs \
            --manifest "$RUNNER_TEMP/bevy-runtime-r2-release.json" \
            --driver worker --bucket mir2-web3-assets \
            --includeReleaseManifest false --ensureBucket false --dryRun true

      - name: Verify existing leaves and prepare only missing objects
        id: missing
        run: |
          node scripts/verify-bevy-runtime-r2-upload.mjs \
            --releaseManifest "$RUNNER_TEMP/bevy-runtime-r2-release.json" \
            --prepareMissing "$RUNNER_TEMP/bevy-runtime-r2-missing.json"

      - name: Dry run the missing subset without publishing credentials
        if: ${{ steps.missing.outputs.missing_count != '0' }}
        run: |
          node scripts/upload-r2-assets.mjs \
            --manifest "$RUNNER_TEMP/bevy-runtime-r2-missing.json" \
            --driver worker --bucket mir2-web3-assets \
            --includeReleaseManifest false --ensureBucket false --dryRun true

      # This step only calls the existing authenticated uploader. It cannot
      # publish an asset manifest, deploy a Worker, or change a runtime binding.
      - name: Upload only missing leaves through the existing upload Worker
        if: ${{ steps.missing.outputs.missing_count != '0' }}
        env:
          MIR2_R2_UPLOAD_WORKER_URL: ${{ secrets.MIR2_R2_UPLOAD_WORKER_URL }}
          MIR2_R2_UPLOAD_SECRET: ${{ secrets.MIR2_R2_UPLOAD_SECRET }}
        run: |
          test -n "$MIR2_R2_UPLOAD_WORKER_URL"
          test -n "$MIR2_R2_UPLOAD_SECRET"
          node scripts/upload-r2-assets.mjs \
            --manifest "$RUNNER_TEMP/bevy-runtime-r2-missing.json" \
            --driver worker --bucket mir2-web3-assets \
            --includeReleaseManifest false --ensureBucket false \
            --concurrency 1 --maxAttempts 6 --progressEvery 1

      - name: Verify all published leaf hashes and WASM storage encoding
        run: |
          node scripts/verify-bevy-runtime-r2-upload.mjs \
            --releaseManifest "$RUNNER_TEMP/bevy-runtime-r2-release.json" \
            --verifyRemote
