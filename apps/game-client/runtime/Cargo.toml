[package]
name = "mir2-bevy-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal Bevy WASM runtime for mir2-web3"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgl2"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_winit",
  "multi_threaded",
  "png",
  # NativeActivity glue for the Android host. Only compiled on Android targets;
  # harmless to the wasm and desktop builds.
  "android-native-activity"
] }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.72"
mir2-client-bevy = { path = "../client-bevy" }
mir2-client-core = { path = "../client-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.95"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
