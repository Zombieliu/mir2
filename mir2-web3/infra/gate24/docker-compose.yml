name: mir2-gate24

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - "no-new-privileges:true"
    - "seccomp=./seccomp.json"
  pids_limit: 128
  mem_limit: 1g
  cpus: 2.0
  ulimits:
    nofile:
      soft: 1024
      hard: 1024
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65534,gid=65534

services:
  zone-host:
    <<: *hardened
    build:
      context: ../..
      dockerfile: Dockerfile
      target: zone-host
    image: mir2-gate24-zone-host:local
    user: "65534:65534"
    labels:
      com.obelisk.sandbox.seccomp-sha256: "${MIR2_GATE24_SECCOMP_SHA256:?required}"
    environment:
      MIR2_ZONE_HOST_ADDR: "0.0.0.0:7020"
      MIR2_ZONE_HOST_CRYSTAL_WORLD: "0"
      MIR2_ZONE_HOST_MAX_CONNECTIONS: "64"
      MIR2_ZONE_HOST_MAX_SESSIONS: "32"
      MIR2_ZONE_HOST_MAX_SESSIONS_PER_ZONE: "16"
      MIR2_ZONE_HOST_TOKEN: "gate24-zone-rpc-token"
      MIR2_ACCOUNT_STORE_PATH: "/var/lib/obelisk/accounts.json"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65534,gid=65534
      - /var/lib/obelisk:rw,noexec,nosuid,nodev,size=256m,uid=65534,gid=65534
    expose: ["7020"]
    networks: [home-private]
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/7020'"]
      interval: 1s
      timeout: 2s
      retries: 30

  home-relay:
    <<: *hardened
    build:
      context: ../..
      dockerfile: Dockerfile
      target: home-relay
    image: mir2-gate24-home-relay:local
    user: "65534:65534"
    env_file: [../gate22/generated/fixture.env]
    environment:
      MIR2_HOME_RELAY_ID: "gate22-relay"
      MIR2_HOME_RELAY_QUIC_BIND: "0.0.0.0:7443"
      MIR2_HOME_RELAY_GATEWAY_BIND: "0.0.0.0:7444"
      MIR2_HOME_RELAY_TLS_CA_DER: "/run/gate22/ca.der"
      MIR2_HOME_RELAY_TLS_CERT_CHAIN_DER: "/run/gate22/relay.der"
      MIR2_HOME_RELAY_TLS_KEY_DER: "/run/gate22/relay-key.der"
      MIR2_HOME_PLACEMENTS_FILE: "/run/gate22/placements.json"
      MIR2_HOME_RELAY_MAX_AGENT_CONNECTIONS: "16"
      MIR2_HOME_RELAY_MAX_GATEWAY_CONNECTIONS: "64"
      MIR2_HOME_RELAY_MAX_STREAMS_PER_NODE: "32"
    volumes:
      - ../gate22/generated:/run/gate22:ro
    ports:
      - "18443:7443/udp"
      - "127.0.0.1:18444:7444"
    networks: [relay-public]

  home-agent:
    <<: *hardened
    build:
      context: ../..
      dockerfile: Dockerfile
      target: home-agent
    image: mir2-gate24-home-agent:local
    user: "65534:65534"
    env_file: [../gate22/generated/fixture.env]
    environment:
      MIR2_HOME_RELAY_ID: "gate22-relay"
      MIR2_HOME_RELAY_ADDR: "home-relay:7443"
      MIR2_HOME_RELAY_SERVER_NAME: "relay.test"
      MIR2_HOME_LOCAL_ZONE_RPC_ADDR: "zone-host:7020"
      MIR2_HOME_AGENT_TLS_CA_DER: "/run/gate22/ca.der"
      MIR2_HOME_AGENT_TLS_CERT_CHAIN_DER: "/run/gate22/agent.der"
      MIR2_HOME_AGENT_TLS_KEY_DER: "/run/gate22/agent-key.der"
      MIR2_HOME_AGENT_KEY_GENERATION: "1"
      MIR2_HOME_CAPACITY_CERTIFICATE_FILE: "/run/gate22/capacity-certificate.json"
    volumes:
      - ../gate22/generated:/run/gate22:ro
    depends_on:
      zone-host:
        condition: service_healthy
      home-relay:
        condition: service_started
    networks: [relay-public, home-private]

  acceptance:
    profiles: ["acceptance"]
    <<: *hardened
    build:
      context: ../..
      dockerfile: Dockerfile
      target: home-tunnel-acceptance
    image: mir2-gate24-acceptance:local
    user: "65534:65534"
    environment:
      MIR2_HOME_ACCEPTANCE_RELAY_ADDR: "home-relay:7444"
      MIR2_HOME_ACCEPTANCE_ZONE_ID: "primary"
      MIR2_HOME_ACCEPTANCE_SESSION_ID: "gate24-sandbox-session"
      MIR2_ZONE_HOST_TOKEN: "gate24-zone-rpc-token"
    depends_on: [home-agent]
    networks: [relay-public]

networks:
  relay-public: {}
  home-private:
    internal: true
