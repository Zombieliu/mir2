# Private cache only. AUTH/SELECT are unsupported by the current Gateway cache
# client; isolation is a separate process, loopback bind and trusted local host.
bind 127.0.0.1
protected-mode yes
port 6381
daemonize no
supervised no
logfile ""
dir /var/lib/mir2-playtest/redis
dbfilename dump.rdb
appendonly yes
appendfsync everysec
save ""
maxmemory 96mb
# Do not evict session ownership leases or identity-revocation records.
maxmemory-policy noeviction
maxclients 128
tcp-keepalive 60
