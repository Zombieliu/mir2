        {
          "uid": "mir2-econ-inflation",
          "title": "可交易金币通胀：连续7完整日高于存量基准130%",
          "condition": "C",
          "for": "10m",
          "noDataState": "NoData",
          "execErrState": "Error",
          "isPaused": false,
          "labels": {
            "service": "mir2-economy",
            "severity": "red",
            "economy_rule": "inflation"
          },
          "annotations": {
            "summary": "可交易金币通胀：连续7完整日高于存量基准130%",
            "description": "按北京时间04:00闭合的经济日和版本化基准计算；缺日期或缺基准产生数据异常，不代表业务阈值已触发。此告警只通知，不变更游戏资产。"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 864000,
                "to": 0
              },
              "datasourceUid": "mir2-economy-readonly",
              "model": {
                "refId": "A",
                "datasource": {
                  "type": "grafana-postgresql-datasource",
                  "uid": "mir2-economy-readonly"
                },
                "rawQuery": true,
                "format": "time_series",
                "rawSql": "WITH bounds AS (\n  SELECT ((now() AT TIME ZONE 'Asia/Shanghai' - interval '4 hours')::date - 1) AS closed_date\n), calendar AS (\n  SELECT r.realm_id, d::date AS economy_date\n  FROM public.hunting_permit_observability_realms r CROSS JOIN bounds b\n  CROSS JOIN LATERAL generate_series(b.closed_date - (7 - 1), b.closed_date, interval '1 day') d\n  WHERE r.enabled IS TRUE\n)\nSELECT now() AS time, c.realm_id,\n  CASE WHEN count(o.economy_date) = 7\n    AND bool_and(o.is_complete IS TRUE)\n    AND bool_and((o.unbound_gold_stock >= 0 AND o.unbound_stock_baseline_gold > 0) IS TRUE)\n  THEN CASE WHEN bool_and((o.unbound_gold_stock::numeric > o.unbound_stock_baseline_gold::numeric * 1.30) IS TRUE) THEN 1.0 ELSE 0.0 END\n  ELSE NULL::double precision END AS value\nFROM calendar c LEFT JOIN public.hunting_permit_daily_observations o\n  ON o.realm_id = c.realm_id AND o.economy_date = c.economy_date\nGROUP BY c.realm_id ORDER BY c.realm_id;",
                "intervalMs": 60000,
                "maxDataPoints": 1000
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.5
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
