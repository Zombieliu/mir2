[package]
name = "mir2-game-data"
version = "0.1.0"
edition = "2021"
description = "Normalized bootstrap data for the Mir2 web3 rewrite"
license = "MIT"

[lib]
name = "mir2_game_data"
path = "src/lib.rs"

[dependencies]
mir2-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
