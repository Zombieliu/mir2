[package]
name = "mir2-admin-api"
version = "0.1.0"
edition = "2021"
description = "Audited admin control-plane primitives for the Mir2 web3 rewrite"
license = "MIT"

[lib]
name = "mir2_admin_api"
path = "src/lib.rs"

[[bin]]
name = "mir2-admin-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
mir2-game-data = { path = "../../packages/game-data" }
mir2-simulation = { path = "../simulation" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
