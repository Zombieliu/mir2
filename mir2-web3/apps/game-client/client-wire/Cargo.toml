[package]
name = "mir2-client-wire"
version = "0.1.0"
edition = "2021"
publish = false
description = "Strict external durable NPC purchase messages"
license = "MIT"

# Independent client boundary; no simulation, Core or renderer dependencies.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
