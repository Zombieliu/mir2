[package]
name = "mir2-platform-windows"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Windows desktop host for the mir2-web3 Bevy client"
license = "MIT"

# Host crates stay independent from the server workspace while the client tree
# is migrated incrementally, matching client-core and runtime.
[workspace]

[[bin]]
name = "mir2-platform-windows"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_text",
  "system_clipboard",
  "bevy_winit",
  "custom_cursor",
  "multi_threaded",
  "png",
  "system_font_discovery",
  "android-native-activity"
] }
console_error_panic_hook = "0.1.7"
flate2 = "1"
futures-util = "0.3"
mir2-bevy-runtime = { path = "../runtime" }
mir2-client-bevy = { path = "../client-bevy", features = ["native-ui"] }
mir2-game-data = { path = "../../../packages/game-data" }
mir2-protocol = { path = "../../../packages/protocol" }
mir2-ui-core = { path = "../ui-core" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }

# Keep native iteration debuggable while avoiding Bevy's prohibitively slow
# fully-unoptimized render/update path. Workspace crates retain lightweight
# optimization for useful stepping; third-party dependencies are optimized so
# the 100 ms Crystal action clock is not delayed by long debug frames.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
