[package]
name = "mir2-platform-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lightweight browser adapter for shared Mir2 client interaction policies"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
presentation-ui = []
npc-purchase-policy = ["dep:mir2-client-wire"]
catalog-transport-policy = ["dep:mir2-protocol"]

[dependencies]
mir2-client-core = { path = "../client-core" }
mir2-protocol = { path = "../../../packages/protocol", features = ["catalog-gzip"], optional = true }
mir2-client-wire = { path = "../client-wire", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.118"

[dev-dependencies]
mir2-client-wire = { path = "../client-wire" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
