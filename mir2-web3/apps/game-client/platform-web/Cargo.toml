[package]
name = "mir2-platform-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lightweight browser adapter for shared Mir2 client interaction policies"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
presentation-ui = []

[dependencies]
mir2-client-core = { path = "../client-core" }
mir2-client-wire = { path = "../client-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.118"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
