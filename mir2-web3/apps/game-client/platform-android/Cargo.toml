[package]
name = "mir2-platform-android"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Android host for the mir2-web3 Bevy client"
license = "MIT"

# Host crates stay independent from the server workspace while the client tree
# is migrated incrementally, matching client-core, runtime and platform-windows.
[workspace]

[lib]
name = "mir2_platform_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mir2-platform-android"
path = "src/main.rs"

[dependencies]
mir2-bevy-runtime = { path = "../runtime" }
mir2-ui-core = { path = "../ui-core" }
mir2-client-bevy = { path = "../client-bevy" }
bevy = { version = "0.19.0", default-features = false, features = ["bevy_asset", "bevy_ui", "bevy_text", "bevy_core_pipeline", "bevy_log", "bevy_render", "bevy_sprite", "bevy_winit", "multi_threaded", "png", "android-game-activity"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
