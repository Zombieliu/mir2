plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mir2.web3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mir2.web3'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.1.0-login'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    // Align the legacy jdk7/jdk8 artifacts pulled by AndroidX with the merged
    // Kotlin stdlib so Gradle packages one class owner for each symbol.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
    // Keep this aligned with Bevy 0.19 / android-activity 0.6.1.
    implementation 'androidx.games:games-activity:4.4.0'
    // games-activity 4.4.0 publishes an empty POM even though its Java API
    // extends AppCompatActivity and implements AndroidX Core listener types.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
